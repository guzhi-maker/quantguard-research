<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QuantGuard 股票数据核对与风险预警">
  <title>QuantGuard | 股票风险体检</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="QuantGuard 首页">
      <span class="brand-mark">QG</span>
      <span class="brand-copy"><strong>QuantGuard</strong><small>风控研判</small></span>
    </a>
    <div class="header-status" aria-label="服务状态">
      <span class="status-item"><i id="agentDot" class="status-dot"></i><span id="agentStatus">检测 DeepSeek</span></span>
      <span class="status-item status-muted" id="clock">--</span>
    </div>
  </header>

  <main class="workspace">
    <section class="intake" aria-labelledby="pageTitle">
      <div class="intake-heading">
        <span class="eyebrow">STOCK RISK CHECK</span>
        <h1 id="pageTitle">股票风险体检</h1>
      </div>

      <form id="analysisForm" class="analysis-form">
        <label class="symbol-field" for="symbolInput">
          <span>股票代码</span>
          <input id="symbolInput" type="text" inputmode="numeric" autocomplete="off" value="600519,300750,601318" placeholder="600519, 300750">
        </label>
        <label class="window-field" for="historyDays">
          <span>历史窗口</span>
          <select id="historyDays">
            <option value="60">60 个交易日</option>
            <option value="120" selected>120 个交易日</option>
            <option value="250">250 个交易日</option>
          </select>
        </label>
        <button class="primary-button" id="analyzeButton" type="submit">开始智能研判</button>
      </form>
    </section>

    <section id="jobPanel" class="job-panel" aria-labelledby="jobTitle" hidden>
      <div class="job-head">
        <div>
          <span class="eyebrow">LIVE PIPELINE</span>
          <h2 id="jobTitle">正在研判</h2>
        </div>
        <div class="job-progress">
          <strong id="jobPercent">0%</strong>
          <span id="jobStage">等待启动</span>
        </div>
      </div>
      <div class="progress-track" aria-label="任务进度"><div id="progressBar" class="progress-bar"></div></div>
      <div id="traceList" class="trace-list" aria-live="polite"></div>
    </section>

    <section id="emptyState" class="empty-state">
      <span class="empty-index">01</span>
      <div>
        <h2>等待一次风险体检</h2>
        <p>当前没有正在查看的研判结果。</p>
      </div>
    </section>

    <section id="resultView" class="result-view" aria-live="polite" hidden>
      <section class="verdict" aria-labelledby="verdictTitle">
        <div class="verdict-main">
          <div>
            <span id="overallLevel" class="level-badge">低风险</span>
            <h2 id="verdictTitle">研判结论</h2>
            <p id="overallHeadline">—</p>
          </div>
          <span id="resultTime" class="result-time">—</span>
        </div>
        <div class="metric-grid" aria-label="研判摘要">
          <div><span>行情核对</span><strong id="metricVerified">—</strong></div>
          <div><span>高风险股票</span><strong id="metricHighRisk">—</strong></div>
          <div><span>实时资讯</span><strong id="metricNews">—</strong></div>
          <div><span>数据问题</span><strong id="metricIssues">—</strong></div>
        </div>
      </section>

      <section class="brief-section" aria-labelledby="briefTitle">
        <header class="section-head">
          <div>
            <span class="eyebrow">DEEPSEEK NOTE</span>
            <h2 id="briefTitle">机器研判</h2>
          </div>
          <span id="briefBadge" class="quiet-badge">复核中</span>
        </header>
        <div id="deepseekBrief" class="brief-copy"></div>
        <p id="briefFallback" class="inline-alert" hidden></p>
      </section>

      <section class="stocks-section" aria-labelledby="stocksTitle">
        <header class="section-head">
          <div>
            <span class="eyebrow">STOCK QUEUE</span>
            <h2 id="stocksTitle">风险队列</h2>
          </div>
          <span id="stockCount" class="quiet-badge">0 只</span>
        </header>
        <div id="stockList" class="stock-list"></div>
      </section>

      <section class="detail-section" aria-labelledby="detailTitle">
        <header class="section-head detail-head">
          <div>
            <span class="eyebrow">EVIDENCE</span>
            <h2 id="detailTitle">证据明细</h2>
          </div>
          <div class="tabs" role="tablist" aria-label="证据分类">
            <button type="button" class="tab is-active" data-tab="alerts" role="tab">风险预警</button>
            <button type="button" class="tab" data-tab="news" role="tab">新闻公告</button>
            <button type="button" class="tab" data-tab="quality" role="tab">数据核对</button>
            <button type="button" class="tab" data-tab="raw" role="tab">采集证据</button>
          </div>
        </header>
        <div id="detailContent" class="detail-content"></div>
      </section>

      <section class="audit-footer" aria-label="研判记录">
        <div>
          <span>研判编号</span>
          <strong id="auditId">—</strong>
        </div>
        <div>
          <span>行情快照</span>
          <strong id="runId">—</strong>
        </div>
        <label class="history-picker" for="historySelect">
          <span>历史研判</span>
          <select id="historySelect" aria-label="选择历史研判"></select>
        </label>
      </section>
    </section>

    <p class="disclaimer">课程研究用途，不构成投资建议或交易指令。</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
